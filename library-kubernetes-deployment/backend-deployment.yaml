
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend
  namespace: manu-usecase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-backend
  template:
    metadata:
      labels:
        app: library-backend
    spec:
      containers:
        - name: backend
          image: host.docker.internal:8082/library-management-usecase1/library-backend:828304f
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: library-backend-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: POSTGRES_PASSWORD

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: ADMIN_PASSWORD

          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18

          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
