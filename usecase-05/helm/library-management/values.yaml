
# Library Management System - Helm Default Values

backend:
  replicaCount: 1
  image:
    repository: host.docker.internal:8082/library-management-usecase1/library-backend
    tag: "828304f"
  service:
    port: 8080

frontend:
  replicaCount: 1
  image:
    repository: host.docker.internal:8082/library-management-usecase1/library-frontend
    tag: "v1"
  service:
    port: 8080

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "18"
  service:
    name: database
    port: 5432
  database: library_management
  storage:
    storageClassName: standard
    accessMode: ReadWriteOnce
    size: 2Gi

ingress:
  enabled: true
  className: nginx
  host: library-gitops.localhost