apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - {{ .Values.postgres.storage.accessMode | quote }}
  storageClassName: {{ .Values.postgres.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size | quote }}